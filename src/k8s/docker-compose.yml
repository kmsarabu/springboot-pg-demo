version: '3.8'
services:

  master:
    image: postgres:16.0-bullseye
    container_name: postgres
    command: -c log_lock_waits=on -c idle_in_transaction_session_timeout='30min' -c shared_preload_libraries='pg_stat_statements' -c max_wal_size='16GB' -c shared_buffers=131072
    platform: linux/amd64
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5432:5432'
    volumes: 
      - pg16-data:/var/lib/postgresql/data
      - ../../test.sql:/docker-entrypoint-initdb.d/create_database.sql
    restart: unless-stopped

  springboot:
    image: springboot-postgres-app:latest
    build:
      context: ../../
      dockerfile: src/k8s/Dockerfile
    container_name: springboot
    platform: linux/amd64
    ports:
      - '8080:8080'
    volumes:
      - ../../src/main/resources/application.properties:/app/application.properties
    restart: unless-stopped

volumes:
  pg16-data:
    driver: local
    name: pg16-data
